<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora de tipos de cambio de moneda">
    <link rel="stylesheet" href="./style/style.css">
    <title>Calculadora de tipos de cambio</title>
</head>
<body>
    <main>
        <h1>Calculadora de tipos de cambio</h1>
        <p>Choose de currensy and the amounts</p>

<div class="container">
    <div class="currency">
        <select id="currency-one" class="">
            <option value="USD" selected >USD - Dólar estadounidense</option>
            <option value="EUR">EUR - Euro</option>
            <option value="GBP">GBP - Libra esterlina</option>
            <option value="JPY">JPY - Yen japonés</option>
            <option value="CAD">CAD - Dólar canadiense</option>
            <option value="AUD">AUD - Dólar australiano</option>
            <option value="CHF">CHF - Franco suizo</option>
            <option value="CNY">CNY - Yuan chino</option>
            <option value="SEK">SEK - Corona sueca</option>
            <option value="NOK">NOK - Corona noruega</option>
        </select>
        <input type="number" id="amount-one" placeholder="0" value="1">

        <div class="swap-rate-container">
            <button class="btn" id="rate">Swap</button>
            <div class="rate" id="rate"></div>
        </div>


    </div>
        <div class="currency">
        <select id="currency-two" class="">
            <option value="USD">USD - Dólar estadounidense</option>
            <option value="EUR" selected >EUR - Euro</option>
            <option value="GBP">GBP - Libra esterlina</option>
            <option value="JPY">JPY - Yen japonés</option>
            <option value="CAD">CAD - Dólar canadiense</option>
            <option value="AUD">AUD - Dólar australiano</option>
            <option value="CHF">CHF - Franco suizo</option>
            <option value="CNY">CNY - Yuan chino</option>
            <option value="SEK">SEK - Corona sueca</option>
            <option value="NOK">NOK - Corona noruega</option>
        </select>
        <input type="number" id="amount-two" placeholder="0">
    </div>

</div>
        
    </main>

    <script type="module" src="./script.js"></script>
</body>
</html>
