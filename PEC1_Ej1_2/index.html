<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora de tipos de cambio de moneda">
    <link rel="stylesheet" href="./style/style.css">
    <title>Calculadora de tipos de cambio</title>
</head>
<body>
    <main>
        <h1>Calculadora de tipos de cambio</h1>
        <form id="exchange-form">
            <div>
                <label for="amount">Cantidad</label>
                <input
                    id="amount"
                    name="amount"
                    type="number"
                    min="0"
                    step="any"
                    inputmode="decimal"
                    required
                >
            </div>

            <div>
                <label for="base-currency">Moneda de origen</label>
                <select id="base-currency" name="baseCurrency" required>
                    <option value="USD" selected>USD - Dólar estadounidense</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GBP">GBP - Libra esterlina</option>
                    <option value="JPY">JPY - Yen japonés</option>
                    <option value="CAD">CAD - Dólar canadiense</option>
                </select>
            </div>

            <div>
                <label for="target-currency">Moneda de destino</label>
                <select id="target-currency" name="targetCurrency" required>
                    <option value="EUR" selected>EUR - Euro</option>
                    <option value="USD">USD - Dólar estadounidense</option>
                    <option value="GBP">GBP - Libra esterlina</option>
                    <option value="JPY">JPY - Yen japonés</option>
                    <option value="CAD">CAD - Dólar canadiense</option>
                </select>
            </div>

            <button type="submit">Convertir</button>
        </form>

        <p id="loading" role="status" aria-live="polite" hidden>
            Consultando tipos de cambio…
        </p>
        <p id="error" role="alert" hidden></p>
        <p id="result" aria-live="polite"></p>
    </main>

    <script type="module" src="./script.js"></script>
</body>
</html>
